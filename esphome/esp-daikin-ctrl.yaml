esphome:
  name: esp-daikin-ctrl
  friendly_name: "ESP32 WiFi Daikin Controller"
  name_add_mac_suffix: True

esp32:
  variant: esp32c6
  flash_mode: dio
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  logs:
    p1p2_sniffer: INFO
    homebus: INFO
    daikin_ducted.climate: INFO
    wifi: INFO
    api: INFO

#Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Daikin-C6-Fallback"
    password: "DeinFallbackPasswort"

captive_portal: 

external_components:
  - source: components

status_led:
    pin: GPIO18

# Internal carrier for a passive P1/P2 bus monitor; it is NOT a controllable climate.
# The following sensors are exposed separately to Home Assistant.
climate:
  - platform: daikin_ducted
    id: daikin0
    name: "Altherma Protocol Monitor"
    internal: true

    rx_pin: 4       # MAX22088 DOUT
    tx_pin: 5       # MAX22088 DIN, never used in this mode
    enable_pin: 8   # MAX22088 RST; HIGH disables bus transmitter
    sniffer_only: true

    # EKHBH016AB6WN / older EWYQ-profile (passive readback).
    altherma_heating_setpoint:
      name: "Altherma Heizwasser Solltemperatur"
    altherma_flow_temperature:
      name: "Altherma Vorlauftemperatur"
    altherma_dhw_temperature:
      name: "Altherma Brauchwassertemperatur"
    altherma_dhw_setpoint:
      name: "Altherma Brauchwasser Solltemperatur"
    altherma_outdoor_temperature:
      name: "Altherma Außentemperatur (experimentell)"

    altherma_circulation_pump:
      name: "Altherma Umwälzpumpe"
    altherma_compressor:
      name: "Altherma Verdichter"

    # These are controller enable flags, not proof of an active heating cycle.
    altherma_heating_enabled:
      name: "Altherma Heizbetrieb freigegeben"
    altherma_dhw_enabled:
      name: "Altherma Brauchwasserbereitung freigegeben"
    altherma_quiet_mode:
      name: "Altherma Flüstermodus"

    # Optionally enable if cooling is supported:
    # altherma_cooling_setpoint:
    #   name: "Altherma Kühlwasser Solltemperatur"

text_sensor:
  - platform: git_ref
    name: "Git Ref"
    long: true
    all: true
    always: true
    abbrev: 8
    dirty: "-dirty"