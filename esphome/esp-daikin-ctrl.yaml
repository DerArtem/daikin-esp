esphome:
  name: esp-daikin-ctrl
  friendly_name: "ESP32 WiFi Daikin Controller"
  name_add_mac_suffix: True

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  logs:
    p1p2_sniffer: INFO
    homebus: INFO
    daikin_ducted.climate: INFO
    wifi: INFO
    api: INFO

#Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Daikin-C6-Fallback"
    password: "DeinFallbackPasswort"

captive_portal: 

external_components:
  - source: components

status_led:
    pin: GPIO18

climate:
  - platform: daikin_ducted
    id: daikin0
    name: "Ducted AC"

    # P1P2/Homebus interface
    rx_pin:          # RX from MAX22088
      number: 4
      ignore_strapping_warning: true
    tx_pin: 5        # TX to MAX22088
    enable_pin: 8    # MAX22088 RST, HIGH disables TX
    sniffer_only: true  # read-only: do not initialize TX or reply to polls

    homekit_climate:
      name: "Ducted AC HomeKit"

    homekit_fan:
      name: "Ducted AC Fan"

    outdoor_intake_temperature:
      name: "Outdoor Intake Temperature"
      filters:
        - throttle_average: 60s
    coolant_temperature:
      name: "Coolant Temperature"
      filters:
        - throttle_average: 60s
    indoor_temperature:
      name: "Indoor Temperature"
      filters:
        - throttle_average: 60s
      
    filter_clean:
      name: "Filter Status"

text_sensor:
  - platform: git_ref
    name: "Git Ref"
    long: true
    all: true
    always: true
    abbrev: 8
    dirty: "-dirty"